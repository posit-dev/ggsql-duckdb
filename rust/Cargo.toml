[package]
name = "ggsql_ext_rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# ggsql: default features disabled to avoid pulling duckdb-rs (bundled = second DuckDB
# linked into our extension = binary bloat and symbol clashes). Dialect is inlined in
# dialect.rs so we don't need the `duckdb` feature.
# Writers: `vegalite` powers the browser/HTTP-server display path; `svg`, `pdf`,
# and `hep` are the native hephaestus-backed writers. Those are vector-only, so
# they pull in no wgpu/GPU rasteriser and need only a runtime fontconfig on
# Linux (fontique dlopens it). Raster formats (png/jpeg/tiff/webp) are
# deliberately left out: they require a GPU adapter at render time.
ggsql = { version = "0.5.2", default-features = false, features = ["vegalite", "svg", "pdf", "hep"] }

# Arrow: ffi for consuming DuckDB's ArrowArrayStream. `arrow::compute::concat_batches`
# is always compiled — no feature flag needed. Pinned to the same major as ggsql's
# `arrow` dep (58) so `DataFrame::from_record_batch` accepts the `RecordBatch` we build.
arrow = { version = "58", default-features = false, features = ["ffi"] }

serde_json = "1"
# base64: inline .hep documents into self-contained HTML output.
base64 = "0.22"
tiny_http = "0.12"
open = "5"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
